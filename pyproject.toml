[project]
name = "fastapi-beginner"
version = "0.1.0"
description = "learning FastAPI by building an Analytics API"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "timescaledb (>=0.2.1,<0.3.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "sqlalchemy (>=2.0.52,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
